[package]
name = "scimkeys"
version = "0.1.0"
edition = "2021"
authors = ["Velithar contributors"]
description = "Corsair Scimitar PRO RGB side-button daemon"
license = "MIT"
repository = "https://github.com/Velithar/scimkeys"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
env_logger = "0.11.11"
evdev = "0.13.2"
log = "0.4.33"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"

[package.metadata.deb]
maintainer = "Zachariah Durbin <dev@zachariahdurbin.me>"
section = "utils"
priority = "optional"
depends = "$auto"
maintainer-scripts = "packaging/debian"
systemd-units = { unit-name = "scimkeys", enable = true, start = true }
conf-files = ["/etc/scimkeys.toml"]
assets = [
  ["target/release/scimkeys", "usr/bin/", "755"],
  ["packaging/scimkeys.toml", "etc/scimkeys.toml", "644"],
  ["README.md", "usr/share/doc/scimkeys/README", "644"],
]
